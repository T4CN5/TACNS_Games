{% extends "core/base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-5">
            
            <h1 class="mb-4">
                Login
            </h1>
            
            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary w-100">
                    
                    Entrar

                </button>
                
            </form>

        </div>

    </div>

</div>
{% endblock %}
