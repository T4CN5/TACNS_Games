{% extends "core/base.html" %}

{% block content %}

<div class="container py-5">

    <div class="card">

        <div class="card-body">

            <h2>
                Excluir produto
            </h2>

            <p>
                Tem certeza que deseja excluir
                <strong>{{ produto.nome }}</strong>?
            </p>

            <form method="post">

                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-danger">

                    Sim, excluir

                </button>

                <a
                    href="{% url 'loja:produto_detalhe' produto.id %}"
                    class="btn btn-secondary">

                    Cancelar

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
