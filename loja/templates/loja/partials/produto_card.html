{% load static %}  
<!-- Substituída a classe .produto-card genérica pelo nosso design gamer estruturado -->
<div class="card h-100 shadow-sm produto-card border-0">
    
    {% if produto.imagem %}
        <!-- ADICIONADO: Esse container é essencial para segurar o efeito de Zoom da foto -->
        <div class="card-img-container">
            <img
                src="{{ produto.imagem.url }}"
                class="card-img-top produto-imagem"
                alt="{{ produto.nome }}"
            >
        </div>
    {% else %}
        <!-- Ajustado para combinar com o Dark Mode caso o jogo não tenha foto -->
        <div class="bg-dark text-center p-5 text-muted" style="height: 280px; display: flex; align-items: center; justify-content: center;">
            <i class="bi bi-image fs-1 d-block mb-2"></i> Sem imagem
        </div>
    {% endif %}

    <div class="card-body d-flex flex-column justify-content-between">
        <div>
            <h5 class="card-title fw-bold text-white mb-2">
                {{ produto.nome }}
            </h5>

            <span class="badge bg-secondary mb-2">
                {{ produto.categoria.nome }}
            </span>

            <p class="card-text text-muted small">
                {{ produto.descricao|truncatechars:90 }}
            </p>
        </div>

        <div class="mt-auto">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <h5 class="fw-bold m-0 text-white">
                    R$ {{ produto.preco|floatformat:2 }}
                </h5>

                {% if produto.estoque > 0 %}
                    <span class="badge badge-gamer-success">
                        Disponível
                    </span>
                {% else %}
                    <span class="badge badge-gamer-danger">
                        Esgotado
                    </span>
                {% endif %}
            </div>

            <div class="d-flex gap-2">
                <!-- Seus botões com suas classes exclusivas perfeitamente organizados -->
                <a href="{% url 'loja:produto_detalhe' produto.id %}" class="btn btn-gamer-outline w-50">
                    Ver detalhes
                </a>
                <a href="{% url 'pedidos:adicionar_carrinho' produto.id %}" class="btn btn-gamer-primary w-50">
                    Comprar
                </a>
            </div>
        </div>
    </div>
</div>
