{% load static %}  
<div class="card h-100 shadow-sm produto-card">
    
    {% if produto.imagem %}

    <img
        src="{{ produto.imagem.url }}"
        class="card-img-top produto-imagem"
        alt="{{ produto.nome }}"
    >

{% else %}

    <div class="bg-light text-center p-5">
        Sem imagem
    </div>

{% endif %}

    <div class="card-body">

        <h5 class="card-title">
            {{ produto.nome }}
        </h5>

        <!-- ALTERAÇÃO AQUI: Adicionado .nome para acessar o texto da categoria relacionada -->
        <span class="badge bg-secondary mb-2">
            {{ produto.categoria.nome }}
        </span>

        <p class="card-text">
            {{ produto.descricao }}
        </p>

        <h5 class="fw-bold">
            R$ {{ produto.preco|floatformat:2 }}
        </h5>

        {% if produto.estoque > 0 %}

            <span class="badge bg-success">
                Disponível
            </span>

        {% else %}

            <span class="badge bg-danger">
                Esgotado
            </span>

        {% endif %}

        <div class="mt-3 d-flex gap-2">

            <a href="{% url 'loja:produto_detalhe' produto.id %}" class="btn btn-primary">
                Ver detalhes
            </a>

            <a href="{% url 'pedidos:adicionar_carrinho' produto.id %}" class="btn btn-success">
                Adicionar ao carrinho
            </a>

        </div>

    </div>

</div>
