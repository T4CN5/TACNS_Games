{% extends "core/base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-5">

            <div class="card usuario-card">

                <div class="card-body p-5">

                    <h1>
                        Entrar
                    </h1>

                    <form method="post">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <button
                            class="btn btn-primary w-100"
                            type="submit"
                        >
                            Entrar
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
